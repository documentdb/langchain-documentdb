name: Bug report
description: Report reproducible incorrect behavior in a DocumentDB LangChain integration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues before filing a report. Do not include connection
        strings, access tokens, account identifiers, or production data.
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      options:
        - Python / LangChain
        - JavaScript or TypeScript / LangChain.js
        - Go / langchaingo
        - Java / LangChain4j
        - .NET / Microsoft.Extensions.VectorData
        - Shared tooling or documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version or Git commit SHA where the issue occurs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest credential-free example and exact steps.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, runtime, driver, and DocumentDB deployment versions.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, tokens, account identifiers, and production data.
          required: true
