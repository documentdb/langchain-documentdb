name: Feature request
description: Propose an integration capability or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      options:
        - Python / LangChain
        - JavaScript or TypeScript / LangChain.js
        - Go / langchaingo
        - Java / LangChain4j
        - .NET / Microsoft.Extensions.VectorData
        - Cross-language
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need or compatibility gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API and expected behavior without including credentials or private data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
